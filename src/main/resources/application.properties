spring.application.name=storeapp-consumer-eureka-ribbon-hystrix-resilience4j-MP
server.port=9993

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# by default its 1 Minute
execution.isolation.thread.timeoutInMilliseconds=5000

management.endpoints.web.exposure.include=*
# management.endpoints.web.exposure.include=health, info, prometheus

resilience4j.circuitbreaker.circuit-breaker-aspect-order=1
resilience4j.retry.retry-aspect-order=2

resilience4j.retry.instance.product-service.max-attempts=3
resilience4j.retry.instance.product-service.wait-duration=2s
resilience4j.retry.instance.product-service.enable-exponential-backoff=true
resilience4j.retry.instance.product-service.exponential-backoff-multiplier=5
